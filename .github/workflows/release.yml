name: Release

# Publie une release GitHub avec l'installateur Windows de GameREZ.
#   git tag v0.1.0 && git push origin v0.1.0
# ou bouton « Run workflow » (onglet Actions) : utilise la version de tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lire la version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$version (tauri.conf.json)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Build + publication de la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: GameREZ v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Télécharger

            - **`GameREZ_${{ steps.version.outputs.version }}_x64-setup.exe`** : installateur Windows (recommandé). Installe GameREZ pour ton compte (sans droits admin) et crée un raccourci sur le bureau + dans le menu Démarrer.
            - **`GameREZ_${{ steps.version.outputs.version }}_x64_portable.exe`** : version portable, rien à installer (WebView2 requis, déjà présent sur Windows 10/11 à jour).

            Windows SmartScreen peut afficher « Windows a protégé votre ordinateur » car l'exe n'est pas signé : clique sur *Informations complémentaires* puis *Exécuter quand même*.

            GameREZ ne touche jamais aux fichiers ni à la mémoire des jeux : zéro risque de ban.

      - name: Ajouter l'exe portable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          cp src-tauri/target/release/GameREZ.exe "GameREZ_${v}_x64_portable.exe"
          gh release upload "v$v" "GameREZ_${v}_x64_portable.exe" --clobber
