name: Release

# Publie une release GitHub avec l'installateur Windows de REZ launcher
# + le manifeste signé `latest.json` utilisé par la mise à jour automatique.
#   git tag v0.2.0 && git push origin v0.2.0
# ou bouton « Run workflow » (onglet Actions) : utilise la version de tauri.conf.json.
#
# Secret requis : TAURI_SIGNING_PRIVATE_KEY (clé privée minisign, voir README).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lire la version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$version (tauri.conf.json)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Build (installateur + signature de mise à jour)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Préparer les fichiers de la release
        run: node scripts/release-assets.mjs

      - name: Publier la release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" release-out/assets/* --clobber
            gh release edit "v$v" --title "REZ launcher v$v" --notes-file release-out/notes.md --draft=false --latest
          else
            gh release create "v$v" release-out/assets/* --title "REZ launcher v$v" \
              --notes-file release-out/notes.md --target "$GITHUB_SHA" --latest
          fi
