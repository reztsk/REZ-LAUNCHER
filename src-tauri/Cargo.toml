[package]
name = "rez-launcher"
version = "0.3.0"
description = "REZ launcher — open-source desktop game launcher & playtime tracker"
authors = ["REZ launcher contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "rez_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.36.1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
